name: Contrast

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  contrast:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: sootbean/soot-preview-action@1c65429233655ae0b202925e9db2bac05256dc97
        with:
          package-manager: yarn
          node-version: 20
          install: yarn install --frozen-lockfile && yarn intl:compile && yarn --cwd dev-env install --frozen-lockfile
          runner: hosted
          port: 8082
          sidecar-ports: 1986,3000,3001,3002,2584
          start: >-
            yarn e2e:mock-server &
            until curl --fail --silent http://localhost:1986/ > /dev/null; do sleep 1; done;
            export EXPO_PUBLIC_BLUESKY_PROXY_DID=$(curl --fail --silent -X POST 'http://localhost:1986/?users&follows&posts' | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).appviewDid');
            EXPO_PUBLIC_ENV=e2e NODE_ENV=test RN_SRC_EXT=e2e.ts,e2e.tsx
            yarn expo start --port 8082 --clear
